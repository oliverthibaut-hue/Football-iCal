name: Update Football Calendars

on:
  schedule:
    - cron: "15 5 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Update calendars
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python update_all.py

      - name: Commit updated calendars
        run: |
          git config user.name "football-calendar-bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            Real-Madrid.ics \
            Malaga-CF.ics \
            real-madrid-source.ics \
            malaga-source.ics \
            laliga-2026.json \
            champions-2026.json

          git diff --cached --quiet || \
          git commit -m "Automatic calendar update"

          git push
