name: Update Football Calendars

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Update calendars
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python update_all.py
          python merge_history.py

      - name: Commit updated calendars
        run: |
          git config user.name "football-calendar-bot"
          git config user.email "actions@users.noreply.github.com"

          git add Real-Madrid.ics Malaga-CF.ics

          git diff --cached --quiet || git commit -m "Automatic calendar update"
          git push

      - name: Prepare GitHub Pages
        run: |
          mkdir -p public
          cp Real-Madrid.ics public/Real-Madrid.ics
          cp Malaga-CF.ics public/Malaga-CF.ics

          printf '%s\n' \
            '<!DOCTYPE html>' \
            '<html lang="fr">' \
            '<head>' \
            '  <meta charset="UTF-8">' \
            '  <title>Football iCal</title>' \
            '</head>' \
            '<body>' \
            '  <h1>Football iCal</h1>' \
            '  <p><a href="Real-Madrid.ics">Real Madrid CF</a></p>' \
            '  <p><a href="Malaga-CF.ics">Málaga CF</a></p>' \
            '</body>' \
            '</html>' \
            > public/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: update
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
